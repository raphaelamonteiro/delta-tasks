services:

  db:
    image: postgres:16-alpine
    container_name: delta_tasks_db
    restart: unless-stopped
    env_file:
      - .env
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    ports:
      - "5440:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}" ]
      interval: 5s
      timeout: 5s
      retries: 10

  app:
    build:
      context: .
      dockerfile: Dockerfile
    image: delta-tasks-app:latest
    container_name: delta_tasks_app
    restart: unless-stopped
    env_file:
      - .env
    environment:
      POSTGRES_HOST: db
      UVICORN_RELOAD: ${UVICORN_RELOAD:-false}
    ports:
      - "8000:8000"
    volumes:
      - app_logs:/app/logs
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test: [ "CMD", "curl", "-fsS", "http://localhost:8000/openapi.json" ]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 30s

volumes:
  app_logs:
  postgres_data:
